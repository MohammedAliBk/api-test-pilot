<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API Test Pilot — Auth Prototypes Comparison Launcher</title>
  <link rel="icon" type="image/svg+xml" href="../../../public/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../reference/tokens.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../../reference/tailwind.preset.js"></script>
  <script>
    if (typeof preset !== 'undefined') {
      tailwind.config = preset;
    }
  </script>
  <style>
    body {
      background-color: var(--color-surface);
      color: var(--color-text-primary);
      font-family: var(--font-sans);
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }
    .btn-press:active {
      transform: scale(0.98);
    }
    .iframe-container {
      transition: width 0.3s ease, height 0.3s ease;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-surface text-text-primary selection:bg-[var(--color-primary)] selection:text-white">

  <!-- TOP APP BAR -->
  <header class="h-14 border-b border-line bg-surface-raised px-4 flex items-center justify-between z-30 flex-shrink-0">
    <!-- Brand / Title -->
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-control bg-surface-subtle border border-line-strong flex items-center justify-center p-1">
        <svg viewBox="0 0 64 64" class="w-full h-full">
          <circle cx="32" cy="32" r="30" fill="none" stroke="var(--color-line-strong)" stroke-width="2"></circle>
          <path d="M16 32 L28 44 L48 20" fill="none" stroke="var(--color-primary)" stroke-width="6" stroke-linecap="round"></path>
        </svg>
      </div>
      <div>
        <div class="flex items-center gap-2">
          <span class="font-bold tracking-tight text-sm text-text-primary">API Test Pilot</span>
          <span class="text-[11px] font-mono px-2 py-0.5 rounded-pill bg-primary-subtle text-primary border border-line">Gate GD</span>
        </div>
        <p class="text-[10px] text-text-muted">Auth Prototype Comparison Suite (Login & Registration)</p>
      </div>
    </div>

    <!-- Direction Selector Tabs -->
    <div class="flex items-center p-1 rounded-control bg-surface-subtle border border-line">
      <button id="tab-v1" onclick="selectDirection('v1.html', 'tab-v1')" class="px-3 py-1 text-xs font-semibold rounded-control transition-all bg-surface-raised text-text-primary shadow-scalar-1">
        v1: 3D Typeflow & Seamless Auth ⭐
      </button>
      <button id="tab-v2" onclick="selectDirection('v2.html', 'tab-v2')" class="px-3 py-1 text-xs font-semibold rounded-control transition-all text-text-secondary hover:text-text-primary">
        v2: Glass Card
      </button>
      <button id="tab-v3" onclick="selectDirection('v3.html', 'tab-v3')" class="px-3 py-1 text-xs font-semibold rounded-control transition-all text-text-secondary hover:text-text-primary">
        v3: Dual-Pane Deck
      </button>
      <button id="tab-v4" onclick="selectDirection('v4.html', 'tab-v4')" class="px-3 py-1 text-xs font-semibold rounded-control transition-all text-text-secondary hover:text-text-primary">
        v4: Bento Terminal
      </button>
    </div>

    <!-- Viewport & Utilities -->
    <div class="flex items-center gap-2">
      <!-- Responsive Viewport Toggles -->
      <div class="flex items-center p-1 rounded-control bg-surface-subtle border border-line">
        <button id="vp-full" onclick="setViewport('100%', '100%', 'vp-full')" title="Responsive 100%" class="px-2 py-1 text-xs rounded-control bg-surface-raised text-text-primary">
          <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
          </svg>
        </button>
        <button id="vp-desktop" onclick="setViewport('1280px', '800px', 'vp-desktop')" title="Desktop (1280px)" class="px-2 py-1 text-xs rounded-control text-text-secondary hover:text-text-primary">
          <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
          </svg>
        </button>
        <button id="vp-tablet" onclick="setViewport('768px', '900px', 'vp-tablet')" title="Tablet (768px)" class="px-2 py-1 text-xs rounded-control text-text-secondary hover:text-text-primary">
          <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z" />
          </svg>
        </button>
        <button id="vp-mobile" onclick="setViewport('375px', '667px', 'vp-mobile')" title="Mobile (375px)" class="px-2 py-1 text-xs rounded-control text-text-secondary hover:text-text-primary">
          <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z" />
          </svg>
        </button>
      </div>

      <!-- Direct Open Button -->
      <a id="btn-direct-link" href="v1.html" target="_blank" class="h-8 px-2.5 rounded-control bg-surface-subtle hover:bg-surface border border-line text-text-primary text-xs flex items-center gap-1.5 transition-all">
        <span>Open Tab</span>
        <svg class="w-3 h-3 text-text-muted" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
        </svg>
      </a>

      <!-- Theme Switcher -->
      <button onclick="toggleTheme()" class="h-8 px-2.5 rounded-control bg-surface-subtle hover:bg-surface border border-line text-text-primary text-xs flex items-center gap-1.5 transition-all">
        Theme
      </button>
    </div>
  </header>

  <!-- IFRAME VIEWPORT CONTAINER -->
  <main class="flex-1 flex items-center justify-center p-4 bg-surface-subtle overflow-auto">
    <div id="frame-wrapper" class="iframe-container w-full h-full flex items-center justify-center">
      <iframe id="preview-frame" src="v1.html" class="w-full h-full rounded-card border border-line bg-surface shadow-hero"></iframe>
    </div>
  </main>

  <!-- BOTTOM BAR / METADATA -->
  <footer class="h-9 border-t border-line bg-surface-raised px-4 flex items-center justify-between text-xs text-text-secondary flex-shrink-0">
    <div class="flex items-center gap-4">
      <span>Active Target: <code id="active-slug" class="text-primary font-mono text-[11px]">v1.html</code></span>
      <span>API Endpoint: <code class="text-text-muted font-mono text-[11px]">https://mohamed1551.runasp.net/api/Auth</code></span>
    </div>
    <div class="flex items-center gap-4">
      <span class="text-[11px] text-text-muted">Passes check-tokens.mjs: <strong class="text-semantic-success">100%</strong></span>
      <a href="NOTES.md" class="text-primary hover:underline text-[11px]">View Design Rationale (NOTES.md)</a>
    </div>
  </footer>

  <!-- Script -->
  <script>
    let activeDirection = 'v1.html';

    function selectDirection(file, tabId) {
      activeDirection = file;
      document.getElementById('preview-frame').src = file;
      document.getElementById('btn-direct-link').href = file;
      document.getElementById('active-slug').textContent = file;

      ['tab-v1', 'tab-v2', 'tab-v3', 'tab-v4'].forEach(id => {
        const btn = document.getElementById(id);
        if (id === tabId) {
          btn.className = 'px-3 py-1 text-xs font-semibold rounded-control transition-all bg-surface-raised text-text-primary shadow-scalar-1';
        } else {
          btn.className = 'px-3 py-1 text-xs font-semibold rounded-control transition-all text-text-secondary hover:text-text-primary';
        }
      });
    }

    function setViewport(w, h, vpId) {
      const frameWrapper = document.getElementById('frame-wrapper');
      frameWrapper.style.width = w;
      frameWrapper.style.height = h;

      ['vp-full', 'vp-desktop', 'vp-tablet', 'vp-mobile'].forEach(id => {
        const btn = document.getElementById(id);
        if (id === vpId) {
          btn.className = 'px-2 py-1 text-xs rounded-control bg-surface-raised text-text-primary';
        } else {
          btn.className = 'px-2 py-1 text-xs rounded-control text-text-secondary hover:text-text-primary';
        }
      });
    }

    function toggleTheme() {
      const html = document.documentElement;
      const iframe = document.getElementById('preview-frame');
      if (html.getAttribute('data-theme') === 'light') {
        html.removeAttribute('data-theme');
        try {
          iframe.contentDocument.documentElement.removeAttribute('data-theme');
        } catch(e) {}
      } else {
        html.setAttribute('data-theme', 'light');
        try {
          iframe.contentDocument.documentElement.setAttribute('data-theme', 'light');
        } catch(e) {}
      }
    }
  </script>
</body>
</html>
